name: VPN
on: workflow_dispatch
jobs:
  Host-VPN:
    runs-on: ubuntu-latest
    steps:
      - name: Installation
        run: |
          sudo apt-get update && sudo apt upgrade
          sudo apt-get install openvpn 
          sudo bash <(curl -sSL https://raw.githubusercontent.com/hwdsl2/openvpn-install/master/openvpn-install.sh) --auto --proto TCP --port 1194 --clientname meow 
          cat /etc/openvpn/client-meow.ovpn
          sudo systemctl status sshd
      - name: Input Link
        id: input_1
        uses: boasihq/interactive-inputs@v2
        with:
          ngrok-authtoken: ${{ secrets.NGROK_AUTHTOKEN }}
          title: "Enter the youtube url"
          interactive: |
            fields:
              - label: url
                properties:
                  display: "Exit?"
                  type: text
                  required: true
